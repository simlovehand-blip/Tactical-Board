<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical-Board (電子作戦盤)</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header class="app-header">
        <h1>Zero-Step Tactics</h1>
    </header>

    <div class="app-container">
        <!-- 左側：作戦盤キャンバス＆描画ツールバー -->
        <div class="board-section">
            <div class="canvas-wrapper">
                <canvas id="tactics-canvas"></canvas>
            </div>

            <!-- 描画・操作ツールバー -->
            <div class="draw-toolbar">
                <button class="tool-btn active" data-tool="move">👆 コマ移動</button>
                <button class="tool-btn" data-tool="arrow">↗ 動き矢印</button>
                <button class="tool-btn" data-tool="pass">⇢ パス点線</button>
                <button class="tool-btn" data-tool="pen">✏️ ペン</button>
                <span class="toolbar-divider"></span>
                <button class="tool-action-btn" id="btn-undo-draw">↩ 1つ戻す</button>
                <button class="tool-action-btn danger" id="btn-clear-draw">🗑 線を全消去</button>
            </div>
        </div>

        <!-- 右側：コントロールパネル -->
        <aside class="panel-container">
            <div class="panel-header">
                <span>作戦盤</span>
                <span class="panel-en">TACTICS</span>
            </div>

            <div class="action-buttons">
                <button class="btn btn-record" id="btn-record">
                    <span class="rec-icon">●</span>
                    <span id="rec-label">動きを録画する</span>
                </button>
                <button class="btn btn-secondary" id="btn-reset">配置を戻す</button>
            </div>

            <!-- 録画完了後のプレビュー＆保存エリア -->
            <div id="video-result-box" class="video-result-box" style="display: none;">
                <div class="video-result-header">
                    <span>録画完了</span>
                    <button id="btn-close-video" class="btn-mini">✕</button>
                </div>
                <video id="recorded-video" controls playsinline></video>
                <a id="btn-download-video" class="btn btn-download" download="tactics.webm">↓ 動画を保存する</a>
            </div>

            <!-- 設定パネル -->
            <div class="settings-box">
                <div class="settings-title">
                    <span>設定</span>
                    <span class="subtitle" id="settings-subtitle">半面・6対6・6-0</span>
                </div>

                <!-- 半面 / 全面 -->
                <div class="setting-group">
                    <div class="toggle-btns" id="court-mode-btns">
                        <button class="toggle-btn active" data-mode="half">半面</button>
                        <button class="toggle-btn" data-mode="full">全面</button>
                    </div>
                </div>

                <!-- DF陣形プリセット -->
                <div class="setting-group">
                    <label>DF陣形プリセット</label>
                    <div class="num-btns def-btns" id="df-preset-btns">
                        <button class="num-btn active" data-df="6-0">6-0</button>
                        <button class="num-btn" data-df="5-1">5-1</button>
                        <button class="num-btn" data-df="3-2-1">3-2-1</button>
                        <button class="num-btn" data-df="4-2">4-2</button>
                    </div>
                </div>

                <!-- コマ表記モード -->
                <div class="setting-group">
                    <div class="flex-between" style="margin-bottom: 8px;">
                        <label style="margin: 0;">コマ表記</label>
                        <button class="btn-edit-labels" id="btn-open-label-modal">✏️ 表記を編集</button>
                    </div>
                    <div class="num-btns" id="label-mode-btns">
                        <button class="num-btn active" data-label-mode="number">番号</button>
                        <button class="num-btn" data-label-mode="position">ポジション</button>
                        <button class="num-btn" data-label-mode="custom">カスタム</button>
                    </div>
                </div>

                <!-- 人数設定 -->
                <div class="setting-group">
                    <label>人数 <span class="help-text">(退場で5人・7人で攻める など)</span></label>
                    <div class="counter-row">
                        <span class="counter-label">攻撃</span>
                        <div class="num-btns" id="off-count-btns">
                            <button class="num-btn" data-count="4">4人</button>
                            <button class="num-btn" data-count="5">5人</button>
                            <button class="num-btn active" data-count="6">6人</button>
                            <button class="num-btn" data-count="7">7人</button>
                        </div>
                    </div>
                    <div class="counter-row">
                        <span class="counter-label">守備</span>
                        <div class="num-btns def-btns" id="def-count-btns">
                            <button class="num-btn" data-count="4">4人</button>
                            <button class="num-btn" data-count="5">5人</button>
                            <button class="num-btn active" data-count="6">6人</button>
                        </div>
                    </div>
                </div>

                <!-- 相手チーム表示切替 -->
                <div class="setting-group flex-between">
                    <label style="margin: 0;">相手チーム</label>
                    <button class="btn-toggle-opp active" id="btn-toggle-opp">表示中</button>
                </div>

                <!-- サインプレー名 -->
                <div class="setting-group" style="margin-bottom: 0;">
                    <label for="play-name-input">サインプレー名 <span class="help-text">(動画に表示されます)</span></label>
                    <input type="text" id="play-name-input" class="input-text" placeholder="例：クロス／ずらし">
                </div>
            </div>
        </aside>
    </div>

    <!-- コマ表記カスタマイズ用モーダル -->
    <div id="label-modal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>コマ表記のカスタマイズ</h3>
                <button id="btn-close-label-modal" class="btn-mini">✕</button>
            </div>
            <p class="modal-desc">各コマに表示する文字（背番号・選手名など、1〜3文字推奨）を入力してください。保存すると自動で「カスタム」表示に切り替わります。</p>

            <div class="label-edit-columns">
                <div class="label-edit-col">
                    <div class="label-col-title off">攻撃チーム（青）</div>
                    <div id="label-inputs-off" class="label-input-list"></div>
                </div>
                <div class="label-edit-col">
                    <div class="label-col-title def">守備チーム（赤・GK）</div>
                    <div id="label-inputs-def" class="label-input-list"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="btn-reset-labels" class="tool-action-btn danger">初期値に戻す</button>
                <div class="modal-footer-right">
                    <button id="btn-cancel-labels" class="tool-action-btn">キャンセル</button>
                    <button id="btn-save-labels" class="btn btn-save-modal">保存して適用</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
